<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Phage-Go!</title>
    <meta name="app-version" content="2026.10.20-42">
    <link rel="preload" as="image" type="image/webp" href="assets_webp/Intro_back_V2.webp?v=20261020-42" fetchpriority="high">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css?v=20261020-42">
  </head>
  <body>
    <main id="app">
      <div id="playfield">
      <canvas tabindex="-1" id="game" width="1600" height="900" aria-label="Phage-Go juego del ciclo lítico"></canvas>
      <img id="loadingBackdrop" src="assets_webp/Intro_back_V2.webp?v=20261020-42" alt="" fetchpriority="high" decoding="async" draggable="false">
      <div id="safeAreaProbe" aria-hidden="true"></div>
      <div id="canvasControls"></div>
      <div id="gameStatus" class="sr-only" role="status" aria-live="polite"></div>
      <div id="loading" role="status" aria-live="polite"><span id="loadingStatus">Cargando imágenes…</span><button id="retryLoadingButton" class="hidden" type="button">Reintentar</button></div>
      <div id="menuButtons" class="menu-buttons">
        <button id="normalButton" class="menu-icon-button" type="button" disabled data-label="Fácil" aria-label="Modo fácil">
          <img src="assets_webp/phage_easy.webp?v=20261020-42" alt="">
        </button>
        <button id="hardButton" class="menu-icon-button" type="button" disabled data-label="Difícil" aria-label="Modo difícil">
          <img src="assets_webp/phage_hard.webp?v=20261020-42" alt="">
        </button>
      </div>
      <button id="restartButton" class="text-button hidden" type="button">Reiniciar</button>
      <div class="top-controls">
      <button id="menuButton" class="menu-return-button hidden" type="button">Menú</button>
      <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Pantalla completa">⛶ <span>Pantalla completa</span></button>
      </div>
      <div id="displayNotice" class="display-notice hidden" role="status"></div>
      </div>
      <div id="storyIntro" class="story-intro hidden" role="dialog" aria-modal="true" aria-labelledby="storyIntroTitle">
        <h1 id="storyIntroTitle" class="sr-only">Así se juega Phage-Go!</h1>
        <button id="storyIntroNext" class="story-intro-next" type="button" aria-label="Avanzar a la siguiente escena">
          <img id="storyIntroImage" class="story-intro-image" alt="Un fago se acerca a una bacteria" draggable="false">
          <span class="story-intro-footer">
            <span id="storyIntroCaption" class="story-intro-caption">Infecta una bacteria con tu fago.</span>
          </span>
        </button>
      </div>
      <div id="rotateNotice" class="rotate-notice hidden" aria-labelledby="orientationTitle" aria-describedby="orientationMessage">
        <button id="rotateFullscreenButton" class="rotate-icon-button" type="button" aria-label="Activar pantalla completa y girar la pantalla">
          <span class="rotate-icon" aria-hidden="true">↻</span>
        </button>
        <h1 id="orientationTitle">Gira tu pantalla</h1>
        <p id="orientationMessage">Gira tu dispositivo y activa pantalla completa para jugar.</p>
        <p id="rotateStatus" class="sr-only" role="status"></p>
      </div>
    </main>
    <dialog id="soundPanel" aria-labelledby="soundTitle">
      <header><h2 id="soundTitle">Efectos de sonido</h2><button id="soundClose" type="button">Cerrar</button></header>
      <p>Activa o desactiva cada efecto. Puedes escucharlos antes de elegir. Sin música ni ambientes de fondo.</p>
      <div id="soundList"></div>
      <footer><button id="soundSave" type="button">Guardar y exportar JSON</button><p id="soundStatus" role="status"></p></footer>
    </dialog>
    <script src="audio/catalog.js?v=20261020-42"></script>
    <script src="audio/sound.js?v=20261020-42"></script>
    <script src="world-shapes.js?v=20261020-42"></script>
    <script src="world.js?v=20261020-42"></script>
    <script src="enemies.js?v=20261020-42"></script>
    <script src="controls.js?v=20261020-42"></script>
    <script src="game.js?v=20261020-42"></script>
  </body>
</html>
