<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phage-Go!</title>
    <meta name="app-version" content="2026.10.19-25">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css?v=20261019-24">
  </head>
  <body>
    <main id="app">
      <div id="playfield">
      <canvas id="game" width="1600" height="900" aria-label="Phage-Go juego del ciclo litico"></canvas>
      <div id="loading">Cargando assets...</div>
      <div id="menuButtons" class="menu-buttons">
        <button id="normalButton" class="menu-icon-button" type="button" data-label="Fácil" aria-label="Modo fácil">
          <img src="assets_webp/phage_easy.webp" alt="">
        </button>
        <button id="hardButton" class="menu-icon-button" type="button" data-label="Difícil" aria-label="Modo difícil">
          <img src="assets_webp/phage_hard.webp" alt="">
        </button>
      </div>
      <button id="restartButton" class="text-button hidden" type="button">Reiniciar</button>
      <div class="top-controls">
      <button id="menuButton" class="menu-return-button hidden" type="button">Menú</button>
      <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Pantalla completa">⛶ <span>Pantalla completa</span></button>
      </div>
      <div id="displayNotice" class="display-notice hidden" role="status"></div>
      </div>
      <div id="rotateNotice" class="rotate-notice hidden" role="status">
        <div class="rotate-icon" aria-hidden="true">↻</div>
        <h1 id="orientationTitle">Gira tu pantalla</h1>
        <p id="orientationMessage">Gira tu dispositivo y activa pantalla completa para jugar.</p>
        <button id="rotateFullscreenButton" type="button">⛶ Pantalla completa</button>
        <p id="rotateStatus" class="rotate-status" role="status"></p>
      </div>
    </main>
    <dialog id="soundPanel" aria-labelledby="soundTitle">
      <header><h2 id="soundTitle">Efectos de sonido</h2><button id="soundClose" type="button">Cerrar</button></header>
      <p>Activa o desactiva cada efecto. Puedes escucharlos antes de elegir. Sin música ni ambientes de fondo.</p>
      <div id="soundList"></div>
      <footer><button id="soundSave" type="button">Guardar y exportar JSON</button><p id="soundStatus" role="status"></p></footer>
    </dialog>
    <script src="audio/catalog.js?v=20261019-24"></script>
    <script src="audio/sound.js?v=20261019-24"></script>
    <script src="world-shapes.js?v=20261019-24"></script>
    <script src="world.js?v=20261019-24"></script>
    <script src="game.js?v=20261019-25"></script>
  </body>
</html>
