name: Android APK

on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check offline Android launch
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell svc wifi disable
            adb shell am start -n com.maxdesigna7x.phagego/.MainActivity
            sleep 15
            adb shell pidof com.maxdesigna7x.phagego

      - name: Name APK
        id: apk
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            APK="Phage-Go-${GITHUB_REF_NAME}.apk"
          else
            APK="Phage-Go-debug.apk"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: phage-go-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in GitHub Releases
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          APK instalable de Phage-Go para Android.

          - Generada por GitHub Actions desde el código de este repositorio.
          - Incluye el juego y sus recursos para jugar sin conexión.
          - Compilación de depuración para instalación directa; no está firmada para Google Play.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
              --title "Phage-Go Android $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
